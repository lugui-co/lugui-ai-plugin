<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- TODO: troque título e descrição -->
  <title>TODO: título do formulário · Lugui</title>
  <meta name="description" content="TODO: resumo de 1 linha" />

  <!-- Plus Jakarta Sans — fonte oficial da Lugui -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Cliente da data API. O envio público usa lugui.public.create (sem login). -->
  <script src="https://pages-api.coolify.lugui.ai/lugui-data.js"></script>

  <style>
    /* TOKENS Lugui (skills/branding/tokens.css). NÃO invente tokens. */
    :root {
      --lugui-dark: #2B4A42;
      --lugui-lime: #D4F34A;
      --lugui-cream: #EDE8DC;
      --lugui-navy: #1A2332;
      --lugui-white: #FFFFFF;
      --lugui-text: #1A1A1A;
      --lugui-muted: #5F6B68;
      --lugui-border: #D9D4C7;
      --lugui-border-strong: #B5AE9A;
      --lugui-danger: #B8412A;
      --lugui-success: #3F7A4A;
      --lugui-premise: #F4EFD8;
      --lugui-soft: #F7F4EA;
      --radius-sm: 6px;
      --radius-lg: 16px;
      --shadow-md: 0 4px 14px rgba(26, 35, 50, .06);
      --t-fast: .15s;
      --lugui-font-sans: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --lugui-focus-ring: 0 0 0 3px rgba(212, 243, 74, .35);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; font-family: var(--lugui-font-sans); font-size: 15px; line-height: 1.55;
      color: var(--lugui-text); background: var(--lugui-cream);
      -webkit-font-smoothing: antialiased;
    }
    h1 { margin: 0; font-weight: 700; letter-spacing: -.02em; color: var(--lugui-dark); }
    p { margin: 0; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 48px 24px 96px; }
    .brand { display: inline-flex; align-items: center; font-weight: 800; font-size: 20px; letter-spacing: -.02em; color: var(--lugui-dark); text-decoration: none; }
    .brand__dot { color: var(--lugui-lime); }
    .eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--lugui-muted); font-weight: 600; }
    .head { margin: 20px 0 24px; }
    .head h1 { font-size: clamp(26px, 5vw, 34px); line-height: 1.1; margin: 8px 0 8px; }
    .head p { color: var(--lugui-muted); }

    .card { background: var(--lugui-white); border: 1px solid var(--lugui-border); border-radius: var(--radius-lg); padding: 28px; box-shadow: var(--shadow-md); }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .field-label { font-size: 13px; font-weight: 600; color: var(--lugui-dark); }
    .req { color: var(--lugui-danger); }
    input, textarea { width: 100%; padding: 11px 13px; font-family: inherit; font-size: 14px; color: var(--lugui-text); background: var(--lugui-white); border: 1px solid var(--lugui-border); border-radius: var(--radius-sm); transition: border-color var(--t-fast), box-shadow var(--t-fast); }
    textarea { min-height: 90px; resize: vertical; }
    input:focus, textarea:focus { outline: none; border-color: var(--lugui-dark); box-shadow: var(--lugui-focus-ring); }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; font-family: inherit; font-size: 15px; font-weight: 600; border-radius: 8px; border: 1px solid transparent; cursor: pointer; transition: transform .08s ease, background var(--t-fast); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn:focus-visible { outline: none; box-shadow: var(--lugui-focus-ring); }
    .btn-primary { background: var(--lugui-dark); color: var(--lugui-lime); width: 100%; }
    .btn-primary:hover:not(:disabled) { background: var(--lugui-navy); }

    .err { color: var(--lugui-danger); font-size: 13px; margin-top: 10px; }
    .thanks { text-align: center; padding: 16px 8px; }
    .thanks__icon { width: 64px; height: 64px; margin: 0 auto 16px; background: var(--lugui-lime); color: var(--lugui-dark); border-radius: 50%; display: grid; place-items: center; font-size: 30px; font-weight: 800; }
    .thanks h1 { font-size: 24px; margin-bottom: 8px; }
    .footer { margin-top: 20px; text-align: center; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="brand" href="#">lugui<span class="brand__dot">.</span></a>

    <!-- FORMULÁRIO (estado inicial) -->
    <div id="formView">
      <div class="head">
        <div class="eyebrow">TODO: contexto · Lugui</div>
        <h1>TODO: título do formulário</h1>
        <p>TODO: 1–2 frases explicando o que a pessoa está enviando.</p>
      </div>

      <form id="form" class="card" novalidate>
        <!-- TODO: ajuste/adicione campos. O `name` de cada campo vira a chave no registro. -->
        <div class="field">
          <label class="field-label" for="nome">Nome <span class="req">*</span></label>
          <input id="nome" name="nome" type="text" required autocomplete="name" />
        </div>
        <div class="field">
          <label class="field-label" for="email">E-mail <span class="req">*</span></label>
          <input id="email" name="email" type="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label class="field-label" for="telefone">Telefone</label>
          <input id="telefone" name="telefone" type="tel" autocomplete="tel" placeholder="(11) 90000-0000" />
        </div>
        <div class="field">
          <label class="field-label" for="mensagem">Mensagem</label>
          <textarea id="mensagem" name="mensagem" placeholder="Opcional"></textarea>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">Enviar</button>
        <div class="err" id="formErr" role="alert"></div>
      </form>
    </div>

    <!-- OBRIGADO (após enviar) -->
    <div id="thanksView" class="card thanks" hidden>
      <div class="thanks__icon">✓</div>
      <h1>Obrigado!</h1>
      <p class="muted">Recebemos seu envio. Pode fechar esta página.</p>
      <div class="footer">
        <button class="btn btn-primary" id="againBtn" style="width:auto">Enviar outra resposta</button>
      </div>
    </div>
  </main>

  <script>
  /* ===================================================================
     CONFIG — vêm da criação do app (skill lugui-ai:data, padrão c).
     =================================================================== */
  const APP_KEY = "TODO-app-key";       // ex.: "leads-landing-x7k2"
  const FORM_TOKEN = "TODO-form-token"; // o form_token do app (write-only)
  const COLLECTION = "respostas";       // ex.: "leads", "inscricoes"

  const $ = (id) => document.getElementById(id);
  const form = $("form");

  // Monta o objeto do registro a partir dos campos do form.
  function collect() {
    const data = {};
    new FormData(form).forEach((v, k) => { data[k] = typeof v === "string" ? v.trim() : v; });
    return data;
  }

  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    $("formErr").textContent = "";
    const data = collect();
    if (!data.nome || !data.email) { $("formErr").textContent = "Preencha nome e e-mail."; return; }

    const btn = $("submitBtn");
    btn.disabled = true; btn.textContent = "Enviando…";
    try {
      // Envio PÚBLICO, sem login: cria um registro novo (write-only).
      await lugui.public.create(APP_KEY, FORM_TOKEN, COLLECTION, data);
      $("formView").hidden = true;
      $("thanksView").hidden = false;
    } catch (e) {
      btn.disabled = false; btn.textContent = "Enviar";
      if (e instanceof lugui.LuguiRateLimitError) {
        $("formErr").textContent = "Muitos envios em pouco tempo. Aguarde alguns segundos e tente de novo.";
      } else if (e instanceof lugui.LuguiNotFoundError) {
        $("formErr").textContent = "Este formulário não está mais disponível.";
      } else {
        $("formErr").textContent = "Não consegui enviar agora. Tente novamente em instantes.";
      }
    }
  });

  $("againBtn").addEventListener("click", () => {
    form.reset();
    $("submitBtn").disabled = false; $("submitBtn").textContent = "Enviar";
    $("thanksView").hidden = true;
    $("formView").hidden = false;
  });
  </script>
</body>
</html>
