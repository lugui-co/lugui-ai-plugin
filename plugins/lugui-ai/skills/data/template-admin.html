<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- TODO: troque título -->
  <title>Respostas · Lugui</title>
  <meta name="description" content="Painel administrativo dos envios do formulário (acesso @lugui)." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Cliente da data API. Listagem usa lugui.data.* (exige login @lugui). -->
  <script src="https://pages-api.coolify.lugui.ai/lugui-data.js"></script>

  <style>
    /* TOKENS Lugui (skills/branding/tokens.css). NÃO invente tokens. */
    :root {
      --lugui-white: #FFFFFF;
      --lugui-offwhite-50: #FBF8F0;
      --lugui-offwhite: #EDE9DE;
      --lugui-lima: #E9FF81;
      --lugui-lima-hover: #D5EB69;
      --lugui-navy: #02152B;
      --lugui-teal: #234248;
      --lugui-text: #02152B;
      --lugui-text-secondary: #234248;
      --lugui-text-tertiary: #606A73;
      --lugui-border: #D9D6CC;
      --lugui-hairline: #E7E4DB;
      --lugui-danger: #B8412A; /* provisório: semânticos virão do design system */
      --radius-sm: 6px;
      --radius-lg: 16px;
      --t-fast: .15s;
      --lugui-font-display: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --lugui-font-sans: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --lugui-font-mono: ui-monospace, "SF Mono", Monaco, monospace;
      --lugui-focus-ring: 0 0 0 3px rgba(35, 66, 72, .25);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: var(--lugui-font-sans); font-size: 15px; line-height: 1.5; color: var(--lugui-text); background: var(--lugui-white); -webkit-font-smoothing: antialiased; }
    h1, h2 { margin: 0; font-family: var(--lugui-font-display); font-weight: 800; letter-spacing: -.01em; color: var(--lugui-navy); }
    p { margin: 0; }
    .container { max-width: 1080px; margin: 0 auto; padding: 32px 24px 96px; }
    .eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--lugui-text-tertiary); font-weight: 500; }
    .muted { color: var(--lugui-text-tertiary); }

    .appbar { position: sticky; top: 0; z-index: 30; background: var(--lugui-white); border-bottom: 1px solid var(--lugui-hairline); }
    .appbar__inner { max-width: 1080px; margin: 0 auto; display: flex; align-items: center; gap: 16px; padding: 14px 24px; }
    .brand { display: inline-flex; align-items: center; color: var(--lugui-teal); }
    .brand svg { height: 22px; width: auto; display: block; }
    .auth { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--lugui-text-tertiary); }
    .auth__email { font-weight: 600; color: var(--lugui-navy); }

    .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 10px 0 20px; flex-wrap: wrap; }
    .head h1 { font-size: clamp(24px, 4vw, 32px); line-height: 1.2; }
    .count { font-size: 13px; color: var(--lugui-text-tertiary); margin-top: 4px; }

    .table-wrap { border: 1px solid var(--lugui-border); border-radius: var(--radius-lg); overflow: auto; background: var(--lugui-white); }
    table { width: 100%; border-collapse: collapse; }
    th { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--lugui-text-tertiary); font-weight: 600; text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--lugui-border); background: var(--lugui-offwhite-50); white-space: nowrap; }
    td { padding: 12px 14px; font-size: 14px; border-bottom: 1px solid var(--lugui-hairline); vertical-align: top; }
    tr:last-child td { border-bottom: 0; }
    td.when { white-space: nowrap; color: var(--lugui-text-tertiary); font-size: 13px; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; font-family: inherit; font-size: 13px; font-weight: 600; border-radius: 999px; border: 1px solid transparent; cursor: pointer; text-decoration: none; transition: transform .08s ease, border-color var(--t-fast), background var(--t-fast); }
    .btn:active { transform: translateY(1px); }
    .btn:focus-visible { outline: none; box-shadow: var(--lugui-focus-ring); }
    /* CTA oficial: preenchimento lima + texto navy + contorno navy em fundo claro */
    .btn-primary { background: var(--lugui-lima); color: var(--lugui-navy); border-color: var(--lugui-navy); }
    .btn-primary:hover { background: var(--lugui-lima-hover); }
    .btn-secondary { background: var(--lugui-white); color: var(--lugui-navy); border-color: var(--lugui-border); }
    .btn-secondary:hover { border-color: var(--lugui-navy); }
    .btn-danger { background: var(--lugui-white); color: var(--lugui-danger); border-color: var(--lugui-border); }
    .btn-danger:hover { border-color: var(--lugui-danger); }

    .empty { text-align: center; padding: 48px 24px; color: var(--lugui-text-tertiary); border: 1px dashed var(--lugui-border); border-radius: var(--radius-lg); background: var(--lugui-white); }
    .gate { text-align: center; padding: 56px 24px; }
    .callout { padding: 14px 18px; background: var(--lugui-offwhite-50); border-left: 3px solid var(--lugui-navy); border-radius: 6px; font-size: 14px; text-align: left; }
    .err { color: var(--lugui-danger); font-size: 13px; }
    [hidden] { display: none !important; }
  </style>
</head>

  <main class="container">
    <!-- Portão de login -->

      <div class="callout">Painel administrativo — entre com sua conta <strong>@lugui.ai</strong> para ver os envios.</div>

    </section>

    <!-- Painel -->
    <div id="panel" hidden>
      <div class="head">
        <div>
          <div class="eyebrow">Lugui · Painel</div>
          <h1>TODO: título (ex.: Respostas do formulário)</h1>
          <div class="count" id="count"></div>
        </div>
        <div>
          <button class="btn btn-secondary" id="refreshBtn">Atualizar</button>
          <button class="btn btn-primary" id="csvBtn">Exportar CSV</button>
        </div>
      </div>
      <div id="host"><div class="empty">Carregando…</div></div>
    </div>

  <script>
  /* ===================================================================
     CONFIG — o MESMO app/collection do formulário público (padrão c).
     =================================================================== */
  const APP_KEY = "TODO-app-key";   // mesmo do template-form.html
  const COLLECTION = "respostas";   // mesmo do template-form.html

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
  const fmtWhen = (iso) => { if (!iso) return "—"; const d = new Date(iso); return isNaN(d) ? "—" : d.toLocaleString("pt-BR", { day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" }); };

  let ITEMS = [];     // os itens carregados (cada um: {id, data, created_at, ...})
  let COLUMNS = [];    // colunas derivadas das chaves de .data

  function deriveColumns(items) {
    const seen = [];
    items.forEach(it => Object.keys(it.data || {}).forEach(k => { if (!seen.includes(k)) seen.push(k); }));
    return seen;
  }

  // --- Login UI ------------------------------------------------------
  function showGate() { $("authEmail").hidden = true; $("loginBtn").hidden = false; $("gate").hidden = false; $("panel").hidden = true; }
  function showPanel(email) { $("authEmail").textContent = "Logado como " + email; $("authEmail").hidden = false; $("loginBtn").hidden = true; $("gate").hidden = true; $("panel").hidden = false; }
  $("loginBtn").addEventListener("click", () => lugui.login());
  $("gateLogin").addEventListener("click", () => lugui.login());

  // --- Render --------------------------------------------------------
  async function load() {
    const host = $("host");
    try {
      ITEMS = await lugui.data.list(APP_KEY, COLLECTION, { limit: 500 });
      ITEMS.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      $("count").textContent = ITEMS.length ? (ITEMS.length + (ITEMS.length === 1 ? " envio" : " envios")) : "";
      if (!ITEMS.length) {
        host.innerHTML = '<div class="empty">Nenhum envio ainda. Compartilhe o link público do formulário.</div>';
        return;
      }
      COLUMNS = deriveColumns(ITEMS);
      host.innerHTML = `
        <div class="table-wrap"><table>
          <thead><tr>${COLUMNS.map(c => `<th>${esc(c)}</th>`).join("")}<th>Recebido</th><th></th></tr></thead>
          <tbody>${ITEMS.map(it => `
            <tr data-id="${esc(it.id)}">
              ${COLUMNS.map(c => `<td>${esc((it.data || {})[c])}</td>`).join("")}
              <td class="when">${fmtWhen(it.created_at)}</td>
              <td><button class="btn btn-danger" data-del="${esc(it.id)}">Excluir</button></td>
            </tr>`).join("")}</tbody>
        </table></div>`;
      host.querySelectorAll("[data-del]").forEach(btn => btn.addEventListener("click", () => remove(btn.getAttribute("data-del"))));
    } catch (e) {
      if (e instanceof lugui.LuguiAuthError) return boot();
      host.innerHTML = `<div class="err">Erro ao carregar: ${esc(e.message || e)}</div>`;
    }
  }

  async function remove(id) {
    if (!confirm("Excluir este envio? Isso é permanente.")) return;
    try {
      await lugui.data.remove(APP_KEY, COLLECTION, id);
      await load();
    } catch (e) {
      if (e instanceof lugui.LuguiAuthError) return lugui.login();
      alert("Não consegui excluir: " + (e.message || e));
    }
  }

  // --- Exportar CSV (client-side) ------------------------------------
  function csvCell(v) {
    const s = String(v == null ? "" : v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function exportCSV() {
    if (!ITEMS.length) return;
    const cols = COLUMNS.length ? COLUMNS : deriveColumns(ITEMS);
    const header = cols.concat(["recebido_em"]);
    const rows = ITEMS.map(it => cols.map(c => csvCell((it.data || {})[c])).concat([csvCell(it.created_at)]).join(","));
    const csv = "﻿" + header.map(csvCell).join(",") + "\r\n" + rows.join("\r\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (APP_KEY + "-" + COLLECTION + ".csv");
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(a.href);
  }
  $("csvBtn").addEventListener("click", exportCSV);
  $("refreshBtn").addEventListener("click", load);

  // --- Boot ----------------------------------------------------------
  async function boot() {
    const user = await lugui.me();
    if (!user || !user.email) { showGate(); return; }
    showPanel(user.email);
    await load();
  }
  boot();
  </script>
